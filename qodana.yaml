version: "1.0"
linter: qodana-php

php:
    version: "8.4"

profile:
    base:
        name: qodana.recommended
    inspections:
        -   inspection: PhpMissingDocCommentInspection
            enabled: false
        -   inspection: PhpEnforceDocCommentInspection
            enabled: false
        -   inspection: PhpGetterAndSetterCanBeReplacedWithPropertyHooksInspection
            enabled: false
        -   inspection: PhpVariableNamingConventionInspection
            enabled: false
        -   inspection: PhpMethodNamingConventionInspection
            enabled: false
        -   inspection: PhpClassNamingConventionInspection
            enabled: false
        -   inspection: PhpPropertyNamingConventionInspection
            enabled: false
        -   inspection: PhpConstantNamingConventionInspection
            enabled: false
        -   inspection: PhpFunctionNamingConventionInspection
            enabled: false

exclude:
    -   name: All
        paths:
            - vendor
            - var
            - node_modules
            - public/build
            - build
            - dist
            - coverage
            - archive
            - docs/generated
            - .git
            - .idea
            - .qodana
            - composer.json
            - qodana.yaml
            - config/reference.php
