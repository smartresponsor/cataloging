groups:
  - name: category
    rules:
      - alert: testsHighLatency
        expr: category_p95_ms > 700
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: 'tests p95 too high'
      - alert: testsErrorRate
        expr: category_error_rate > 0.005
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: 'tests error rate > 0.5%'
