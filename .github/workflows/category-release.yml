name: tests Release
on:
  push:
    tags:
      - 'category-*'
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: zip -r category-release.zip src config public docs
      - name: Upload
        uses: softprops/action-gh-release@v2
        with:
          files: category-release.zip
