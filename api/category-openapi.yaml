openapi: 3.0.3
info:
  title: SmartResponsor Category API
  description: RC-candidate contract draft for the Category component.
  version: 1.0.0-rc1
  x-reviewed-at: '2026-03-13'
paths:
  /api/category/tree:
    get:
      summary: Get category tree
      responses:
        '200':
          description: OK
  /api/category/{id}/move:
    post:
      summary: Move category
      responses:
        '200':
          description: OK
        '400':
          description: Bad Request
  /api/category/{id}/publish:
    post:
      summary: Publish category
      responses:
        '200':
          description: OK
        '400':
          description: Bad Request
