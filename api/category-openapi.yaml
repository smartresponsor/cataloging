openapi: 3.0.3
info:
  title: SmartResponsor Category API
  version: 1.0.0-rc1
paths:
  /api/category/tree:
    get:
      summary: Get category tree
      responses:
        '200': { description: OK }
  /api/category/{id}/move:
    post:
      summary: Move category
      responses:
        '200': { description: OK }
        '400': { description: Bad Request }
  /api/category/{id}/publish:
    post:
      summary: Publish category
      responses:
        '200': { description: OK }
        '400': { description: Bad Request }
