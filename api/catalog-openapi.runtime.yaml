openapi: 3.0.3
info:
  title: Catalog API Runtime Contract
  version: 1.0.0-rc2
  description: Runtime-aligned OpenAPI contract synchronized with the currently implemented Catalog HTTP surface.
servers:
  - url: /
tags:
  - name: Catalog Read
  - name: Catalog Attachment
  - name: Catalog Collection
  - name: Catalog Virtual
  - name: Catalog Documentation
paths:
  /api/category/list:
    get:
      tags: [Catalog Read]
      summary: List catalog categories
      operationId: listCatalogCategories
      parameters:
        - $ref: '#/components/parameters/FirstParam'
        - $ref: '#/components/parameters/AfterParam'
      responses:
        '200':
          description: Category list returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryListResponse'
  /api/category/{id}:
    get:
      tags: [Catalog Read]
      summary: Read a catalog category by id
      operationId: readCatalogCategoryById
      parameters:
        - $ref: '#/components/parameters/CategoryIdParam'
      responses:
        '200':
          description: Category returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryItemResponse'
        '404':
          description: Category not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                ok: false
                error: not_found
  /api/category/{id}/descendants:
    get:
      tags: [Catalog Read]
      summary: Read a catalog category with descendant tree
      operationId: readCatalogCategoryDescendantsTree
      parameters:
        - $ref: '#/components/parameters/CategoryIdParam'
      responses:
        '200':
          description: Category tree returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryTreeResponse'
        '404':
          description: Category not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                ok: false
                error: not_found
  /api/category/{id}/child:
    get:
      tags: [Catalog Read]
      summary: List direct children for a category
      operationId: listCatalogCategoryChildren
      parameters:
        - $ref: '#/components/parameters/CategoryIdParam'
      responses:
        '200':
          description: Child category list returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryCollectionResponse'
        '404':
          description: Category not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                ok: false
                error: not_found
  /api/category/{id}/ancestor:
    get:
      tags: [Catalog Read]
      summary: List ancestors for a category
      operationId: listCatalogCategoryAncestors
      parameters:
        - $ref: '#/components/parameters/CategoryIdParam'
      responses:
        '200':
          description: Ancestor category list returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryCollectionResponse'
        '404':
          description: Category not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                ok: false
                error: not_found
  /api/category/attachment:
    get:
      tags: [Catalog Attachment]
      summary: List category attachments
      operationId: listCatalogAttachments
      parameters:
        - $ref: '#/components/parameters/CategoryIdFilterParam'
      responses:
        '200':
          description: Attachment list returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttachmentListResponse'
    post:
      tags: [Catalog Attachment]
      summary: Register a category attachment
      operationId: createCatalogAttachment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttachmentCreateRequest'
      responses:
        '201':
          description: Attachment created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttachmentItemResponse'
        '400':
          description: Attachment payload failed validation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorsResponse'
  /api/category/attachment/{attachmentId}:
    delete:
      tags: [Catalog Attachment]
      summary: Delete a category attachment
      operationId: deleteCatalogAttachment
      parameters:
        - $ref: '#/components/parameters/AttachmentIdParam'
      responses:
        '200':
          description: Attachment deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttachmentDeleteResponse'
        '400':
          description: Attachment identifier failed validation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorsResponse'
        '404':
          description: Attachment was not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorsResponse'
  /api/category/collection:
    post:
      tags: [Catalog Collection]
      summary: Build a rule-based collection from projection records
      operationId: buildCatalogCollection
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CollectionBuildRequest'
      responses:
        '200':
          description: Collection build result returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectionBuildResponse'
        '400':
          description: Collection rules payload failed validation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorsResponse'
  /api/category/virtual/preview:
    post:
      tags: [Catalog Virtual]
      summary: Preview a virtual category rule
      operationId: previewCatalogVirtualCategoryRule
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VirtualCategoryPreviewRequest'
      responses:
        '200':
          description: Rule preview returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectionBuildResponse'
        '400':
          description: Preview rules payload failed validation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorsResponse'
  /api/category/virtual/apply/{id}:
    post:
      tags: [Catalog Virtual]
      summary: Apply a virtual category rule
      operationId: applyCatalogVirtualCategoryRule
      parameters:
        - $ref: '#/components/parameters/CategoryIdParam'
      responses:
        '200':
          description: Rule applied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryItemResponse'
        '404':
          description: Virtual category not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                ok: false
                error: not_found
  /api/doc:
    get:
      tags: [Catalog Documentation]
      summary: OpenAPI documentation UI
      operationId: readCatalogDocumentationUi
      responses:
        '200':
          description: Swagger UI page returned
  /api/doc.json:
    get:
      tags: [Catalog Documentation]
      summary: OpenAPI JSON document
      operationId: readCatalogOpenApiJson
      responses:
        '200':
          description: OpenAPI JSON returned
components:
  parameters:
    CategoryIdParam:
      in: path
      name: id
      required: true
      schema:
        type: string
        pattern: '^[0-9A-HJKMNP-TV-Za-hjkmnp-tv-z]{26}$'
        example: 01JQ8S3E2Z8D2B6YJ9V4P7M1NX
    AttachmentIdParam:
      in: path
      name: attachmentId
      required: true
      schema:
        type: string
        minLength: 1
        example: attachment-01JQ8S3E2Z8D2B6YJ9V4P7M1NX
    CategoryIdFilterParam:
      in: query
      name: category_id
      required: false
      schema:
        type: string
        example: 01JQ8S3E2Z8D2B6YJ9V4P7M1NX
    FirstParam:
      in: query
      name: first
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    AfterParam:
      in: query
      name: after
      required: false
      schema:
        type: string
        default: ''
  schemas:
    ErrorResponse:
      type: object
      required: [ok, error]
      properties:
        ok:
          type: boolean
          enum: [false]
        error:
          type: string
          example: not_found
    ErrorsResponse:
      type: object
      required: [ok, errors]
      properties:
        ok:
          type: boolean
          enum: [false]
        errors:
          type: array
          items:
            type: string
    PageInfo:
      type: object
      required: [after]
      properties:
        after:
          type: string
          example: ''
    CategoryNode:
      type: object
      required: [id, name, slug, path, depth]
      properties:
        id:
          type: string
          example: 01JQ8S3E2Z8D2B6YJ9V4P7M1NX
        name:
          type: string
          example: Electronics
        slug:
          type: string
          example: electronics
        path:
          type: string
          example: catalog.electronics
        depth:
          type: integer
          example: 1
    CategoryTreeNode:
      allOf:
        - $ref: '#/components/schemas/CategoryNode'
        - type: object
          required: [children]
          properties:
            children:
              type: array
              items:
                $ref: '#/components/schemas/CategoryNode'
    CategoryItemResponse:
      type: object
      required: [ok, item]
      properties:
        ok:
          type: boolean
          enum: [true]
        item:
          $ref: '#/components/schemas/CategoryNode'
    CategoryCollectionResponse:
      type: object
      required: [ok, items, item]
      properties:
        ok:
          type: boolean
          enum: [true]
        items:
          type: array
          items:
            $ref: '#/components/schemas/CategoryNode'
        item:
          type: array
          items:
            $ref: '#/components/schemas/CategoryNode'
    CategoryTreeResponse:
      type: object
      required: [ok, item]
      properties:
        ok:
          type: boolean
          enum: [true]
        item:
          $ref: '#/components/schemas/CategoryTreeNode'
    CategoryListResponse:
      type: object
      required: [ok, items, item, pageInfo]
      properties:
        ok:
          type: boolean
          enum: [true]
        items:
          type: array
          items:
            $ref: '#/components/schemas/CategoryNode'
        item:
          type: array
          items:
            $ref: '#/components/schemas/CategoryNode'
        pageInfo:
          $ref: '#/components/schemas/PageInfo'
    AttachmentRecord:
      type: object
      additionalProperties: true
    AttachmentListResponse:
      type: object
      required: [ok, items]
      properties:
        ok:
          type: boolean
          enum: [true]
        items:
          type: array
          items:
            $ref: '#/components/schemas/AttachmentRecord'
    AttachmentCreateRequest:
      type: object
      required: [category_id, path]
      properties:
        category_id:
          type: string
        type:
          type: string
          default: icon
        path:
          type: string
    AttachmentItemResponse:
      type: object
      required: [ok, item]
      properties:
        ok:
          type: boolean
          enum: [true]
        item:
          $ref: '#/components/schemas/AttachmentRecord'
    AttachmentDeleteResponse:
      type: object
      required: [ok, attachment_id]
      properties:
        ok:
          type: boolean
          enum: [true]
        attachment_id:
          type: string
    CollectionBuildRequest:
      type: object
      additionalProperties: true
      description: Rule payload is forwarded directly to the runtime request object.
    CollectionBuildResponse:
      type: object
      required: [ok, items, data, total]
      properties:
        ok:
          type: boolean
          enum: [true]
        items:
          type: array
          items:
            $ref: '#/components/schemas/CategoryNode'
        data:
          type: array
          items:
            $ref: '#/components/schemas/CategoryNode'
        total:
          type: integer
          minimum: 0
    VirtualCategoryPreviewRequest:
      allOf:
        - $ref: '#/components/schemas/CollectionBuildRequest'
