openapi: 3.0.3
info:
  title: Catalog API
  version: 1.0.0-rc1
  description: Canonical HTTP API contract for the Catalog component.
paths:
  /api/category/list:
    get:
      summary: List catalog categories
      responses:
        '200':
          description: Category list returned. Runtime exposes canonical `items` and compatibility alias `item`.
  /api/category/{id}:
    get:
      summary: Read a catalog category by id
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Category returned
        '404':
          description: Category not found. Runtime exposes `error` and compatibility `errors`.
  /api/category/{id}/descendants:
    get:
      summary: Read a catalog category with descendant tree
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Category tree returned
        '404':
          description: Category not found. Runtime exposes `error` and compatibility `errors`.
  /api/category/{id}/child:
    get:
      summary: List direct children for a category
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Child category list returned. Runtime exposes canonical `items` and compatibility alias `item`.
        '404':
          description: Category not found. Runtime exposes `error` and compatibility `errors`.
  /api/category/{id}/ancestor:
    get:
      summary: List ancestors for a category
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Ancestor category list returned. Runtime exposes canonical `items` and compatibility alias `item`.
        '404':
          description: Category not found. Runtime exposes `error` and compatibility `errors`.
  /api/category/attachment:
    get:
      summary: List category attachments
      responses:
        '200':
          description: Attachment list returned
    post:
      summary: Register a category attachment
      responses:
        '201':
          description: Attachment created
        '400':
          description: Validation failure. Runtime exposes `error=validation_failed` and detailed `errors`.
  /api/category/attachment/{attachmentId}:
    delete:
      summary: Delete a category attachment
      parameters:
        - in: path
          name: attachmentId
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Attachment deleted
        '400':
          description: Invalid attachment identifier. Runtime exposes `error=validation_failed` and detailed `errors`.
        '404':
          description: Attachment not found. Runtime exposes `error=not_found` and detailed `errors`.
  /api/category/collection:
    post:
      summary: Build a rule-based collection from projection records
      responses:
        '200':
          description: Collection build result returned. Runtime exposes canonical `items` and compatibility alias `data`.
        '400':
          description: Invalid rules payload. Runtime exposes `error=validation_failed` and detailed `errors`.
  /api/category/virtual/preview:
    post:
      summary: Preview a virtual category rule
      responses:
        '200':
          description: Rule preview returned. Runtime exposes canonical `items` and compatibility alias `data`.
        '400':
          description: Invalid rule specification. Runtime exposes `error=validation_failed` and detailed `errors`.
  /api/category/virtual/apply/{id}:
    post:
      summary: Apply a virtual category rule
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Rule applied
        '404':
          description: Virtual category not found. Runtime exposes `error=not_found` and compatibility `errors`.
  /api/doc:
    get:
      summary: OpenAPI documentation UI
      responses:
        '200':
          description: Swagger UI page returned
  /api/doc.json:
    get:
      summary: OpenAPI JSON document
      responses:
        '200':
          description: OpenAPI JSON returned
