services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\Cataloging\Controller\StatusController:
        tags: [ 'controller.service_arguments' ]

    App\Cataloging\Controller\LegacyCategoryListController:
        tags: [ 'controller.service_arguments' ]

    App\Cataloging\Controller\LegacyCollectionListController:
        tags: [ 'controller.service_arguments' ]

    App\Cataloging\Controller\CategoryAttachmentController:
        tags: [ 'controller.service_arguments' ]

    App\Cataloging\Controller\CategoryCollectionController:
        tags: [ 'controller.service_arguments' ]

    App\Cataloging\Controller\CategoryReadController:
        tags: [ 'controller.service_arguments' ]

    App\Cataloging\Controller\CategoryVirtualController:
        tags: [ 'controller.service_arguments' ]

    App\Cataloging\Repository\CatalogAttachmentRepository: ~
    App\Cataloging\Repository\CatalogCollectionProjectionRepository: ~
    App\Cataloging\Repository\CatalogRepository: ~
