services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\Cataloging\Controller\Catalog\CatalogStatusController:
        tags: [ 'controller.service_arguments' ]

    App\Cataloging\Controller\Catalog\CatalogLegacyCategoryListController:
        tags: [ 'controller.service_arguments' ]

    App\Cataloging\Controller\Catalog\CatalogLegacyCollectionListController:
        tags: [ 'controller.service_arguments' ]

    App\Cataloging\Controller\Catalog\CatalogCategoryAttachmentController:
        tags: [ 'controller.service_arguments' ]

    App\Cataloging\Controller\Catalog\CatalogCategoryCollectionController:
