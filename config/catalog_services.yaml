    App\Cataloging\Service\CatalogLegacyCollectionFilterService: ~
    App\Cataloging\Service\CatalogMoveService: ~
    App\Cataloging\Service\CatalogReadService: ~
    App\Cataloging\Service\CatalogVirtualCollectionService: ~
    App\Cataloging\Service\CollectionRuleEngine: ~
    App\Cataloging\Service\CollectionBuilder: ~

    App\Cataloging\ServiceInterface\CatalogMoveServiceInterface: '@App\Cataloging\Service\CatalogMoveService'
