# Import this file from the host only when the component owns Doctrine entities.
# Entity classes remain component-owned and must not be used as external API contracts.
doctrine:
  orm:
    mappings:
      Cataloging:
        type: attribute
        is_bundle: false
        dir: '%kernel.project_dir%/vendor/cataloging/catalog/src/Entity/Catalog/Catalog'
        prefix: 'App\Cataloging\Entity\Catalog'
        alias: Cataloging
