imports:
  - { resource: 'runtime.yaml' }

services:
  _defaults:
    autowire: true
    autoconfigure: true

  # Symfony-native component export surface.
  # The host application may import this file from the component root.
  App\Cataloging\:
    resource: '../../src/'
    exclude:
      - '../../src/Kernel.php'
      - '../../src/DependencyInjection/'
      - '../../src/Entity/'
      - '../../src/Event/'
      - '../../src/EventInterface/'
      - '../../src/Exception/'
      - '../../src/Tests/'
      - '../../src/ValueObject/'
      - '../../src/ValueObjectInterface/'
      - '../../src/Service/CatalogVersionService.php'

  App\Cataloging\Controller\Catalog\CatalogCategoryMerchantController:
    tags: ['controller.service_arguments']

  App\Cataloging\Controller\Catalog\CatalogLegacyCategoryListController:
    tags: ['controller.service_arguments']

  App\Cataloging\Controller\Catalog\CatalogLegacyCollectionListController:
    tags: ['controller.service_arguments']

  App\Cataloging\DataFixtures\MultiCatalogFixtures:
    tags:
      - { name: 'doctrine.fixture.orm', group: 'cataloging' }

  App\Cataloging\Service\CatalogOidcJwtVerifierService:
    arguments:
      $jwkSet: '%catalog.oidc_jwk_set%'
      $audience: '%catalog.oidc_audience%'
      $issuer: '%catalog.oidc_issuer%'
  App\Cataloging\Service\CatalogImportPipelineService:
    arguments:
      $dlqPath: '%kernel.project_dir%/var/cataloging/import-dlq'
  App\Cataloging\Service\CatalogWebhookClientService:
    arguments:
      $secret: '%catalog.webhook_secret%'
      $maxRetry: '%catalog.webhook_max_retry%'
  App\Cataloging\Service\CatalogWebhookNotifierService:
    arguments:
      $endpoint: '%catalog.webhook_endpoint%'
  App\Cataloging\Service\Config\CatalogingOidcConfigService:
    arguments:
      $projectDir: '%kernel.project_dir%'
    tags: ['administering.config_tool']
  App\Cataloging\ServiceInterface\CategoryReadRepositoryInterface:
    alias: App\Cataloging\Repository\Category\CatalogEmptyCategoryReadRepository
  App\Cataloging\ServiceInterface\Import\ImportRepositoryInterface:
    alias: App\Cataloging\Repository\Import\CatalogInMemoryImportRepository
  App\Cataloging\ServiceInterface\Quota\CacheStoreInterface:
    alias: App\Cataloging\Repository\Quota\CatalogInMemoryCacheStore
  App\Cataloging\ServiceInterface\Rule\RuleRepositoryInterface:
    alias: App\Cataloging\Repository\Rule\CatalogInMemoryRuleRepository
  App\Cataloging\RepositoryInterface\Catalog\CatalogCategoryChangeRequestRepositoryInterface:
    alias: App\Cataloging\Repository\Catalog\CatalogCategoryChangeRequestRepository

  App\Cataloging\RepositoryInterface\Catalog\CatalogCategoryReviewAssignmentRepositoryInterface:
    alias: App\Cataloging\Repository\Catalog\CatalogCategoryReviewAssignmentRepository
  App\Cataloging\RepositoryInterface\Catalog\CatalogCategoryAccessAssignmentRepositoryInterface:
    alias: App\Cataloging\Repository\Catalog\CatalogCategoryAccessAssignmentRepository
  App\Cataloging\RepositoryInterface\Catalog\CatalogCategoryMediaBindingRepositoryInterface:
    alias: App\Cataloging\Repository\Catalog\CatalogCategoryMediaBindingRepository
  App\Cataloging\RepositoryInterface\Catalog\CatalogCategoryWorkflowRepositoryInterface:
    alias: App\Cataloging\Repository\Catalog\CatalogCategoryWorkflowRepository
  App\Cataloging\RepositoryInterface\Catalog\CatalogSyndicationDeliveryRecordRepositoryInterface:
    alias: App\Cataloging\Repository\Catalog\CatalogSyndicationDeliveryRecordRepository

  App\Cataloging\Service\Catalog\CatalogCategoryMoveSurfaceBuilder:
    public: true
  App\Cataloging\RepositoryInterface\Catalog\CatalogSyndicationDestinationRepositoryInterface:
    alias: App\Cataloging\Repository\Catalog\CatalogSyndicationDestinationRepository

  App\Cataloging\PolicyInterface\CatalogSyndicationDestinationPolicyInterface:
    alias: App\Cataloging\Policy\CatalogSyndicationDestinationPolicy
  App\Cataloging\PolicyInterface\CatalogSyndicationDestinationGovernanceSummaryPolicyInterface:
    alias: App\Cataloging\Policy\CatalogSyndicationDestinationGovernanceSummaryPolicy
  App\Cataloging\PolicyInterface\CatalogCategoryReviewAssignmentEntityPolicyInterface:
    alias: App\Cataloging\Policy\CatalogCategoryReviewAssignmentEntityPolicy
