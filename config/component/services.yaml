parameters:
  catalog.oidc_jwk_set: []
  catalog.oidc_audience: '%env(default:catalog-dev:CATALOG_OIDC_AUDIENCE)%'
  catalog.oidc_issuer: '%env(default:catalog-dev:CATALOG_OIDC_ISSUER)%'
  catalog.move_connection_name: 'data'

services:
  _defaults:
    autowire: true
    autoconfigure: true

  # Symfony-native component export surface.
  # The host application may import this file from the component root.
  App\Cataloging\:
    resource: '../../src/'
    exclude:
      - '../../src/Kernel.php'
      - '../../src/DependencyInjection/'
      - '../../src/Entity/'
      - '../../src/Tests/'
  App\Cataloging\Service\CatalogMoveService:
    arguments:
      $connectionName: '%catalog.move_connection_name%'

  App\Cataloging\Service\OidcJwtVerifier:
    arguments:
      $jwkSet: '%catalog.oidc_jwk_set%'
      $audience: '%catalog.oidc_audience%'
      $issuer: '%catalog.oidc_issuer%'
  App\Cataloging\RepositoryInterface\CategoryChangeRequestRepositoryInterface:
    alias: App\Cataloging\Repository\CategoryChangeRequestRepository

  App\Cataloging\RepositoryInterface\CategoryReviewAssignmentRepositoryInterface:
    alias: App\Cataloging\Repository\CategoryReviewAssignmentRepository
  App\Cataloging\RepositoryInterface\CategoryAccessAssignmentRepositoryInterface:
    alias: App\Cataloging\Repository\CategoryAccessAssignmentRepository
  App\Cataloging\RepositoryInterface\CategoryMediaBindingRepositoryInterface:
    alias: App\Cataloging\Repository\CategoryMediaBindingRepository
  App\Cataloging\RepositoryInterface\CategoryWorkflowRepositoryInterface:
    alias: App\Cataloging\Repository\CategoryWorkflowRepository
