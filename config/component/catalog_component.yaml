component:
  schema_version: 1
  name: cataloging
  title: Cataloging
  package: cataloging/catalog
  status: rc
  namespace: App
  responsibility: "catalog, category, and product-discovery surfaces"
  export_contract:
    services: config/component/catalog_services.yaml
    routes: config/component/catalog_routes.yaml
    api_platform: config/component/catalog_api_platform.yaml
    doctrine: config/component/catalog_doctrine.yaml
    messenger: config/component/catalog_messenger.yaml
    security: config/component/catalog_security.yaml
    env: config/component/catalog_env.yaml
    smoke: config/component/catalog_smoke.yaml
  host_policy:
    business_logic_owner: component
    composition_owner: host_application
    glue_layer_goal: near_zero
    transport_contracts: dto_api_resource_first
    entities_as_transport_contracts: false

  symfony_bundle:
    class: App\Cataloging\CatalogingBundle
    extension: App\Cataloging\DependencyInjection\CatalogingExtension
    services_loaded_by_extension: config/component/catalog_services.yaml
    routes_import_required_by_host: config/component/catalog_routes.yaml
