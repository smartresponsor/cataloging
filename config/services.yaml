parameters:
    catalog.oidc_jwk_set: []
    catalog.oidc_audience: '%env(default:catalog-dev:CATALOG_OIDC_AUDIENCE)%'
    catalog.oidc_issuer: '%env(default:catalog-dev:CATALOG_OIDC_ISSUER)%'

services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\Cataloging\Form\:
        resource: '../src/Form/'


    App\Cataloging\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Event/'
            - '../src/EventInterface/'
            - '../src/Kernel.php'
            - '../src/ValueObject/'
            - '../src/ValueObjectInterface/'

    App\Cataloging\Controller\Catalog\CatalogStatusController:
        tags: [ 'controller.service_arguments' ]

    App\Cataloging\Controller\Catalog\CatalogCategoryAdminController:
        tags: [ 'controller.service_arguments' ]

    App\Cataloging\Controller\Catalog\CatalogCategorySitemapController:
        tags: [ 'controller.service_arguments' ]

    App\Cataloging\Security\JwtUserProvider:
        arguments:
            $defaultRoles: [ 'ROLE_USER' ]
            $adminIdentifiers: '%env(csv:CATEGORY_API_ADMIN_IDENTIFIERS)%'

    App\Cataloging\ServiceInterface\CatalogCategoryMutationServiceInterface: '@App\Cataloging\Service\CatalogCategoryMutationService'

    App\Cataloging\ServiceInterface\CatalogCategoryProjectionReadServiceInterface: '@App\Cataloging\Service\CatalogCategoryProjectionReadService'
    App\Cataloging\ServiceInterface\CatalogCategoryAdminServiceInterface: '@App\Cataloging\Service\CatalogCategoryAdminService'
    App\Cataloging\ServiceInterface\CatalogCategoryReadScopeServiceInterface: '@App\Cataloging\Service\CatalogCategoryReadScopeService'

    App\Cataloging\IdempotencyInterface\CategoryIdempotencyStoreInterface: '@App\Cataloging\Idempotency\CategoryIdempotencyStore'

    App\Cataloging\RepositoryInterface\Catalog\CatalogCategoryAccessAssignmentRepositoryInterface:
        '@App\Cataloging\Repository\Catalog\CatalogCategoryAccessAssignmentRepository'


    App\Cataloging\AttachmentInterface\AttachmentReferenceGatewayInterface: '@App\Cataloging\Attachment\NullAttachmentReferenceGateway'
    App\Cataloging\ServiceInterface\Security\SecurityExternalIdentityContextMapperInterface:
        '@App\Cataloging\Service\Security\ExternalIdentityContextMapper'
    App\Cataloging\ServiceInterface\Security\SecurityExternalIdentityContextResolverInterface:
        '@App\Cataloging\Service\Security\ExternalIdentityContextResolver'

    App\Cataloging\Attachment\NullAttachmentReferenceGateway: ~
    App\Cataloging\Service\Security\ExternalIdentityContextMapper: ~
    App\Cataloging\Service\Security\ExternalIdentityContextResolver: ~

    App\Cataloging\Service\CatalogOidcJwtVerifierService:
        arguments:
            $jwkSet: '%catalog.oidc_jwk_set%'
            $audience: '%catalog.oidc_audience%'
            $issuer: '%catalog.oidc_issuer%'
