services:
  _defaults:
    autowire: true
    autoconfigure: true

  App\Form\:
    resource: '../src/Form/'

  App\Controller\StatusController:
    tags: ['controller.service_arguments']

  App\Controller\Admin\CategoryAdminController:
    tags: ['controller.service_arguments']

  App\Controller\CategorySitemapController:
    tags: ['controller.service_arguments']

  App\Security\JwtUserProvider:
    arguments:
      $defaultRoles: ['ROLE_USER']
      $adminIdentifiers: '%env(csv:CATEGORY_API_ADMIN_IDENTIFIERS)%'

  App\ServiceInterface\CategoryMutationServiceInterface: '@App\Service\CategoryMutationService'
