parameters:
    catalog.oidc_jwk_set: []
    catalog.oidc_audience: '%env(default:catalog-dev:CATALOG_OIDC_AUDIENCE)%'
    catalog.oidc_issuer: '%env(default:catalog-dev:CATALOG_OIDC_ISSUER)%'

services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\Cataloging\Form\:
        resource: '../src/Form/'


    App\Cataloging\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'

    App\Cataloging\Controller\StatusController:
        tags: [ 'controller.service_arguments' ]

    App\Cataloging\Controller\Admin\CategoryAdminController:
        tags: [ 'controller.service_arguments' ]

    App\Cataloging\Controller\CategorySitemapController:
        tags: [ 'controller.service_arguments' ]

    App\Cataloging\Security\JwtUserProvider:
        arguments:
            $defaultRoles: [ 'ROLE_USER' ]
            $adminIdentifiers: '%env(csv:CATEGORY_API_ADMIN_IDENTIFIERS)%'

    App\Cataloging\ServiceInterface\CategoryMutationServiceInterface: '@App\Cataloging\Service\CategoryMutationService'

    App\Cataloging\ServiceInterface\CategoryProjectionReadServiceInterface: '@App\Cataloging\Service\CategoryProjectionReadService'
    App\Cataloging\ServiceInterface\CategoryReadScopeServiceInterface: '@App\Cataloging\Service\CategoryReadScopeService'

    App\Cataloging\IdempotencyInterface\CategoryIdempotencyStoreInterface: '@App\Cataloging\Idempotency\CategoryIdempotencyStore'

    App\Cataloging\RepositoryInterface\CatalogCategoryAccessAssignmentEntityRepositoryInterface:
        '@App\Cataloging\Repository\CategoryAccessAssignmentRepository'


    App\Cataloging\AttachmentInterface\AttachmentReferenceGatewayInterface: '@App\Cataloging\Attachment\NullAttachmentReferenceGateway'
    App\Cataloging\ServiceInterface\Security\SecurityExternalIdentityContextMapperInterface:
        '@App\Cataloging\Service\Security\ExternalIdentityContextMapper'
    App\Cataloging\ServiceInterface\Security\SecurityExternalIdentityContextResolverInterface:
        '@App\Cataloging\Service\Security\ExternalIdentityContextResolver'

    App\Cataloging\Attachment\NullAttachmentReferenceGateway: ~
    App\Cataloging\Service\Security\ExternalIdentityContextMapper: ~
    App\Cataloging\Service\Security\ExternalIdentityContextResolver: ~

    App\Cataloging\Service\OidcJwtVerifier:
        arguments:
            $jwkSet: '%catalog.oidc_jwk_set%'
            $audience: '%catalog.oidc_audience%'
            $issuer: '%catalog.oidc_issuer%'
